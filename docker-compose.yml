networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge
  zitadel-net:
    driver: bridge
  kafka-net:
    driver: bridge

volumes:
  auth_db_data:
  business_db_data:
  mongo_data:
  redis_data:

services:
  # ----------------------------------------------------
  # Reverse Proxy
  # ----------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./traefik/dynamic:/etc/traefik/dynamic:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public-net

  # ----------------------------------------------------
  # Application Services
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - public-net
    depends_on:
      - backend
    environment:
      - NEXTAUTH_URL=http://platform.127.0.0.1.nip.io
      - NEXTAUTH_SECRET=my-super-secret-key-12345
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - KEYCLOAK_CLIENT_ID=platform-frontend
      - KEYCLOAK_CLIENT_SECRET=VFbnGPXmCy8Cf9KwAbcy4ulLig3MzraN
      - KEYCLOAK_ISSUER=https://login.157.180.43.151.nip.io/realms/EduJournal
      - KEYCLOAK_ADMIN_CLIENT_ID=platform-admin
      - KEYCLOAK_ADMIN_CLIENT_SECRET=Eksf3Rd4uJtV1oW9eOrolcrvI3i4fxcg
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-127.0.0.1.nip.io}`) || Host(`platform.${DOMAIN:-127.0.0.1.nip.io}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://business-db:5432/business_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - public-net
      - backend-net
    depends_on:
      - business-db
      - mongodb
      - redis
      - kafka
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-127.0.0.1.nip.io}`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"

  # ----------------------------------------------------
  # Infrastructure Services
  # ----------------------------------------------------
  business-db:
    image: postgres:16-alpine
    container_name: business-db
    restart: always
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - business_db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d business_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend-net
      - kafka-net
