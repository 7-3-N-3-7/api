http:
  routers:
    keycloak:
      rule: "(Host(`localhost`) || Host(`platform.localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/auth`)"
      priority: 100
      service: keycloak
    backend:
      rule: "((Host(`localhost`) || Host(`platform.localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api/v1`) || PathPrefix(`/actuator`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/backend-coverage`) || PathPrefix(`/backend-cucumber`))) || Host(`api.localhost`)"
      priority: 90
      service: backend
    frontend:
      rule: "Host(`localhost`) || Host(`platform.localhost`) || Host(`127.0.0.1`)"
      priority: 10
      service: frontend
  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8081"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
