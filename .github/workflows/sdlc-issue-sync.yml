name: SDLC Issue & Project Sync

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: "Kørselstilstand (bootstrap opretter Projects v2-boardet via CLI/GraphQL; sync-issue synkroniserer ét Issue)"
        required: true
        default: "sync-issue"
        type: choice
        options:
          - sync-issue
          - bootstrap
      issue_number:
        description: "Issue-nummer til manuel synkronisering (kun ved mode = sync-issue)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  sdlc-sync:
    name: Synkronisér GitHub Issue, Branch & Projects v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bootstrap GitHub Projects v2 Board
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' }}
        env:
          SDLC_PROJECT_TOKEN: ${{ secrets.SDLC_PROJECT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run sdlc:bootstrap

      - name: Sync Issue to .feature Contract & Tree Branch
        if: >-
          ${{
            !(github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap')
            && !contains(github.event.issue.labels.*.name, 'sdlc:seeded')
            && !contains(github.event.issue.labels.*.name, 'sdlc:done')
            && github.event.issue.state != 'closed'
          }}
        env:
          SDLC_PROJECT_TOKEN: "${{ secrets.SDLC_PROJECT_TOKEN || github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          ISSUE_NUMBER: "${{ github.event.issue.number || inputs.issue_number }}"
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            EFFECTIVE_TITLE="${ISSUE_TITLE:-Issue $ISSUE_NUMBER}"
            BODY_TMP="$(mktemp)"
            printf '%s' "$ISSUE_BODY" > "$BODY_TMP"
            npm run sdlc:sync-issue -- --issue "$ISSUE_NUMBER" --title "$EFFECTIVE_TITLE" --body-file "$BODY_TMP"
            rm -f "$BODY_TMP"
          fi
