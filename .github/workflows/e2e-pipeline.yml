name: Reusable E2E Pipeline

on:
  workflow_call:
    inputs:
      backend_tag:
        description: 'Tag for integrate-backend image'
        required: false
        type: string
        default: 'main'
      frontend_tag:
        description: 'Tag for integrate-frontend image'
        required: false
        type: string
        default: 'main'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API Repository
        uses: actions/checkout@v4
        with:
          repository: 7-3-N-3-7/api
          path: api
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: 7-3-N-3-7/backend
          path: backend
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          repository: 7-3-N-3-7/frontend
          path: frontend
          token: ${{ secrets.GH_PAT || github.token }}
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use GH_PAT so it has permission to pull both backend and frontend private images
          password: ${{ secrets.GH_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use GH_PAT so it has permission to pull both backend and frontend private images
          password: ${{ secrets.GH_PAT }}

      - name: Spin Up Environment
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
        run: |
          cd api/infrastructure
          
          # Write all GitHub secrets into the .env file
          cat <<EOF > .env
          TRAEFIK_ACME_EMAIL=${{ secrets.TRAEFIK_ACME_EMAIL }}
          AUTH_DB_USER=${{ secrets.AUTH_DB_USER }}
          AUTH_DB_NAME=${{ secrets.AUTH_DB_NAME }}
          AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}
          BUSINESS_DB_USER=${{ secrets.BUSINESS_DB_USER }}
          BUSINESS_DB_NAME=${{ secrets.BUSINESS_DB_NAME }}
          BUSINESS_DB_PASSWORD=${{ secrets.BUSINESS_DB_PASSWORD }}
          MONGO_USER=${{ secrets.MONGO_USER }}
          MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          ZITADEL_MASTERKEY=${{ secrets.ZITADEL_MASTERKEY }}
          EOF
          
          docker compose up -d
          echo "Waiting for services..."
          sleep 15

      - name: Run Backend API Tests
        run: |
          cd backend
          npm ci
          npm run test --ignore-scripts

      - name: Run Frontend E2E Tests
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps
          npx playwright test