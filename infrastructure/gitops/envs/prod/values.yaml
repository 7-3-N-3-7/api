# GitOps values overrides for ArgoCD
# The actual Helm charts are pulled from an external registry.

backend:
  image:
    repository: my-registry/integrate-backend
    # This SHA hash is automatically updated by the backend repo's CI pipeline
    tag: "latest"
  replicaCount: 3

frontend:
  image:
    repository: my-registry/integrate-frontend
    tag: "latest"
  replicaCount: 3

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: www.integrate.example.com
      paths:
        - path: /
          pathType: Prefix
