# GitOps values overrides for ArgoCD
# The actual Helm charts are pulled from an external registry.

backend:
  image:
    repository: ghcr.io/7-3-n-3-7/backend
    # This tag is automatically updated by the backend repo's CI pipeline
    tag: "dev"
  replicaCount: 1

frontend:
  image:
    repository: ghcr.io/7-3-n-3-7/frontend
    tag: "dev"
  replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: dev.integrate.example.com
      paths:
        - path: /
          pathType: Prefix
