networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge
  zitadel-net:
    driver: bridge
  kafka-net:
    driver: bridge

volumes:
  auth_db_data:
  business_db_data:
  mongo_data:
  redis_data:
  traefik_certs:

secrets:
  auth_db_password:
    environment: "AUTH_DB_PASSWORD"
  keycloak_admin_password:
    environment: "KEYCLOAK_ADMIN_PASSWORD"
  business_db_password:
    environment: "BUSINESS_DB_PASSWORD"
  mongo_password:
    environment: "MONGO_PASSWORD"

services:
  # -------------------------------------------------------------------
  # 0. TRAEFIK (Reverse Proxy & Let's Encrypt SSL)
  # -------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's encrypt configuration
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - public-net

  # -------------------------------------------------------------------
  # 1. KEYCLOAK AUTH DATABASE (PostgreSQL - Auth Isolated)
  # -------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password
    secrets:
      - auth_db_password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - zitadel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. KEYCLOAK IAM (Identity & Access Management)
  # -------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 3. BUSINESS DATABASE (PostgreSQL - Relational Data & Tests)
  # -------------------------------------------------------------------
  business-db:
    image: postgres:16-alpine
    container_name: business-db
    restart: always
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME}
      POSTGRES_USER: ${BUSINESS_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/business_db_password
    secrets:
      - business_db_password
    ports:
      - "5432:5432"
    volumes:
      - business_db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUSINESS_DB_USER} -d ${BUSINESS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 4. MONGODB (Localization i18n & Media Transcripts)
  # -------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 5. REDIS (Redisson Hibernate L2 Cache)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 6. APACHE KAFKA & ZOOKEEPER (Event Streaming)
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend-net
      - kafka-net

  # -------------------------------------------------------------------
  # 7. WATCHTOWER (Automatic Container Updates)
  # -------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json
    # Checks for updates every 12 minutes (720 seconds)
    command: --interval 720

  # -------------------------------------------------------------------
  # 8. BACKEND API
  # -------------------------------------------------------------------
  backend:
    image: ghcr.io/7-3-n-3-7/backend:${BACKEND_TAG:-latest}
    container_name: backend
    restart: always
    env_file:
      - .env
    networks:
      - public-net
      - backend-net
      - kafka-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.157.180.43.151.nip.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # -------------------------------------------------------------------
  # 9. FRONTEND UI
  # -------------------------------------------------------------------
  frontend:
    image: ghcr.io/7-3-n-3-7/frontend:${FRONTEND_TAG:-latest}
    container_name: frontend
    restart: always
    networks:
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`157.180.43.151.nip.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
