networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge
  zitadel-net:
    driver: bridge
  kafka-net:
    driver: bridge

volumes:
  auth_db_data:
  business_db_data:
  mongo_data:
  minio_data:
  redis_data:
  traefik_certs:

services:
  # -------------------------------------------------------------------
  # 0. TRAEFIK (Reverse Proxy & Let's Encrypt SSL)
  # -------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's encrypt configuration
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@157.180.43.151.nip.io"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - public-net

  # -------------------------------------------------------------------
  # 1. ZITADEL AUTH DATABASE (PostgreSQL - Auth Isolated)
  # -------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: zitadel_auth
      POSTGRES_USER: zitadel_user
      POSTGRES_PASSWORD: zitadel_password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - zitadel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel_user -d zitadel_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. ZITADEL IAM (Identity & Access Management)
  # -------------------------------------------------------------------
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.50.0
    container_name: zitadel
    restart: always
    command: start-from-init --masterkey "a-32-byte-long-secret-key-change" --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "a-32-byte-long-secret-key-change"
      ZITADEL_DATABASE_POSTGRES_HOST: "auth-db"
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: "zitadel_auth"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "zitadel_user"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "zitadel_password"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: "disable"
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "zitadel_user"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "zitadel_password"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: "disable"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_EXTERNALDOMAIN: "auth.157.180.43.151.nip.io"
      ZITADEL_EXTERNALPORT: "443"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - public-net
      - zitadel-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zitadel.rule=Host(`auth.157.180.43.151.nip.io`)"
      - "traefik.http.routers.zitadel.entrypoints=websecure"
      - "traefik.http.routers.zitadel.tls.certresolver=myresolver"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
      - "traefik.http.services.zitadel.loadbalancer.server.scheme=h2c"

  # -------------------------------------------------------------------
  # 3. BUSINESS DATABASE (PostgreSQL - Relational Data & Tests)
  # -------------------------------------------------------------------
  business-db:
    image: postgres:16-alpine
    container_name: business-db
    restart: always
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - business_db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d business_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 4. MONGODB (Localization i18n & Media Transcripts)
  # -------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 5. MINIO (Object Storage for Images, Media & User Content)
  # -------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    networks:
      - public-net
      - backend-net
    labels:
      - "traefik.enable=true"
      # MinIO API
      - "traefik.http.routers.minio-api.rule=Host(`s3.157.180.43.151.nip.io`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=myresolver"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`storage.157.180.43.151.nip.io`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=myresolver"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # -------------------------------------------------------------------
  # 6. REDIS (Redisson Hibernate L2 Cache)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 7. APACHE KAFKA & ZOOKEEPER (Event Streaming)
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend-net
      - kafka-net

  # -------------------------------------------------------------------
  # 8. WATCHTOWER (Automatic Container Updates)
  # -------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json
    # Checks for updates every 12 minutes (720 seconds)
    command: --interval 720

  # -------------------------------------------------------------------
  # 9. BACKEND API
  # -------------------------------------------------------------------
  backend:
    image: ghcr.io/7-3-n-3-7/backend:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    networks:
      - public-net
      - backend-net
      - kafka-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.157.180.43.151.nip.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # -------------------------------------------------------------------
  # 10. FRONTEND UI
  # -------------------------------------------------------------------
  frontend:
    image: ghcr.io/7-3-n-3-7/frontend:latest
    container_name: frontend
    restart: always
    networks:
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`157.180.43.151.nip.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
