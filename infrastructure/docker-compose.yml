networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge
  keycloak-net:
    driver: bridge
  kafka-net:
    driver: bridge

volumes:
  auth_db_data:
  business_db_data:
  mongo_data:
  redis_data:
  traefik_certs:

secrets:
  auth_db_password:
    environment: "AUTH_DB_PASSWORD"
  keycloak_admin_password:
    environment: "KEYCLOAK_ADMIN_PASSWORD"
  business_db_password:
    environment: "BUSINESS_DB_PASSWORD"
  mongo_password:
    environment: "MONGO_PASSWORD"

  docker_api_version:
    environment: DOCKER_API_VERSION
  spring_datasource_url:
    environment: SPRING_DATASOURCE_URL
  spring_datasource_username:
    environment: SPRING_DATASOURCE_USERNAME
  kafka_listener_security_protocol_map:
    environment: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
  kafka_zookeeper_connect:
    environment: KAFKA_ZOOKEEPER_CONNECT
  kc_db_url:
    environment: KC_DB_URL
  oauth2_proxy_cookie_secure:
    environment: OAUTH2_PROXY_COOKIE_SECURE
  oauth2_proxy_client_secret:
    environment: OAUTH2_PROXY_CLIENT_SECRET
  oauth2_proxy_email_domains:
    environment: OAUTH2_PROXY_EMAIL_DOMAINS
  spring_data_redis_host:
    environment: SPRING_DATA_REDIS_HOST
  keycloak_admin:
    environment: KEYCLOAK_ADMIN
  oauth2_proxy_upstreams:
    environment: OAUTH2_PROXY_UPSTREAMS
  kc_db_password:
    environment: KC_DB_PASSWORD
  kafka_advertised_listeners:
    environment: KAFKA_ADVERTISED_LISTENERS
  postgres_db:
    environment: POSTGRES_DB
  spring_datasource_password:
    environment: SPRING_DATASOURCE_PASSWORD
  spring_data_mongodb_host:
    environment: SPRING_DATA_MONGODB_HOST
  oauth2_proxy_client_id:
    environment: OAUTH2_PROXY_CLIENT_ID
  kc_http_enabled:
    environment: KC_HTTP_ENABLED
  oauth2_proxy_http_address:
    environment: OAUTH2_PROXY_HTTP_ADDRESS
  kc_db:
    environment: KC_DB
  kc_db_username:
    environment: KC_DB_USERNAME
  kafka_offsets_topic_replication_factor:
    environment: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
  oauth2_proxy_cookie_secret:
    environment: OAUTH2_PROXY_COOKIE_SECRET
  zookeeper_tick_time:
    environment: ZOOKEEPER_TICK_TIME
  kc_proxy_headers:
    environment: KC_PROXY_HEADERS
  spring_kafka_bootstrap_servers:
    environment: SPRING_KAFKA_BOOTSTRAP_SERVERS
  oauth2_proxy_pass_authorization_header:
    environment: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
  kc_hostname:
    environment: KC_HOSTNAME
  mongo_initdb_root_password:
    environment: MONGO_INITDB_ROOT_PASSWORD
  mongo_initdb_root_username:
    environment: MONGO_INITDB_ROOT_USERNAME
  zookeeper_client_port:
    environment: ZOOKEEPER_CLIENT_PORT
  postgres_user:
    environment: POSTGRES_USER
  oauth2_proxy_cookie_domains:
    environment: OAUTH2_PROXY_COOKIE_DOMAINS
  kafka_broker_id:
    environment: KAFKA_BROKER_ID
  kafka_inter_broker_listener_name:
    environment: KAFKA_INTER_BROKER_LISTENER_NAME
  oauth2_proxy_provider:
    environment: OAUTH2_PROXY_PROVIDER
  oauth2_proxy_oidc_issuer_url:
    environment: OAUTH2_PROXY_OIDC_ISSUER_URL
  oauth2_proxy_pass_access_token:
    environment: OAUTH2_PROXY_PASS_ACCESS_TOKEN
  postgres_password:
    environment: POSTGRES_PASSWORD
  spring_security_oauth2_resourceserver_jwt_issuer_uri:
    environment: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
services:
  # -------------------------------------------------------------------
  # 0. TRAEFIK (Reverse Proxy & Let's Encrypt SSL)
  # -------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command: /bin/sh -c "export DOCKER_API_VERSION=$(cat 
      /run/secrets/docker_api_version) && exec --api.insecure=true 
      --providers.docker=true --providers.docker.exposedbydefault=false 
      --entrypoints.web.address=:80 --entrypoints.websecure.address=:443 
      --entrypoints.web.http.redirections.entryPoint.to=websecure 
      --entrypoints.web.http.redirections.entryPoint.scheme=https 
      --certificatesresolvers.myresolver.acme.httpchallenge=true 
      --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web 
      --certificatesresolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL} 
      --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik_certs:/letsencrypt
    networks:
    - public-net

  # -------------------------------------------------------------------
  # 1. KEYCLOAK AUTH DATABASE (PostgreSQL - Auth Isolated)
  # -------------------------------------------------------------------
    secrets:
    - docker_api_version
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
    - POSTGRES_DB_FILE=/run/secrets/postgres_db
    - POSTGRES_USER_FILE=/run/secrets/postgres_user
    - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
    - auth_db_password
    - postgres_db
    - postgres_user
    - postgres_password_file
    volumes:
    - auth_db_data:/var/lib/postgresql/data
    networks:
    - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. KEYCLOAK IAM (Identity & Access Management)
  # -------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    restart: always
    command: start-dev
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
    - "8080:8080"
    networks:
    - backend-net
    - public-net
    - keycloak-net
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.keycloak.rule=Host(`login.157.180.43.151.nip.io`)"
    - "traefik.http.routers.keycloak.entrypoints=websecure"
    - "traefik.http.routers.keycloak.tls.certresolver=myresolver"
    - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    - "traefik.docker.network=infrastructure_public-net"

  # -------------------------------------------------------------------
  # 3. BUSINESS DATABASE (PostgreSQL - Relational Data & Tests)
  # -------------------------------------------------------------------
    secrets:
    - keycloak_admin
    - keycloak_admin_password
    - kc_proxy_headers
    - kc_http_enabled
    - kc_hostname
    - kc_db
    - kc_db_url
    - kc_db_username
    - kc_db_password
  business-db:
    image: postgres:16-alpine
    container_name: business-db
    restart: always
    environment:
    - POSTGRES_DB_FILE=/run/secrets/postgres_db
    - POSTGRES_USER_FILE=/run/secrets/postgres_user
    - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
    - business_db_password
    - postgres_db
    - postgres_user
    - postgres_password_file
    ports:
    - "5432:5432"
    volumes:
    - business_db_data:/var/lib/postgresql/data
    networks:
    - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUSINESS_DB_USER} -d ${BUSINESS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 4. MONGODB (Localization i18n & Media Transcripts)
  # -------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
    - MONGO_INITDB_ROOT_USERNAME_FILE=/run/secrets/mongo_initdb_root_username
    - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_initdb_root_password
    secrets:
    - mongo_password
    - mongo_initdb_root_username
    - mongo_initdb_root_password_file
    ports:
    - "27017:27017"
    volumes:
    - mongo_data:/data/db
    networks:
    - backend-net

  # -------------------------------------------------------------------
  # 5. REDIS (Redisson Hibernate L2 Cache)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
    - "6379:6379"
    volumes:
    - redis_data:/data
    networks:
    - backend-net

  # -------------------------------------------------------------------
  # 6. APACHE KAFKA & ZOOKEEPER (Event Streaming)
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks:
    - kafka-net

    secrets:
    - zookeeper_client_port
    - zookeeper_tick_time
    command: /bin/sh -c "export ZOOKEEPER_CLIENT_PORT=$(cat 
      /run/secrets/zookeeper_client_port) && export ZOOKEEPER_TICK_TIME=$(cat 
      /run/secrets/zookeeper_tick_time) && exec /etc/confluent/docker/run"
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
    - zookeeper
    ports:
    - "9092:9092"
    networks:
    - backend-net
    - kafka-net

  # -------------------------------------------------------------------
  # 7. WATCHTOWER (Automatic Container Updates)
  # -------------------------------------------------------------------
    secrets:
    - kafka_broker_id
    - kafka_zookeeper_connect
    - kafka_advertised_listeners
    - kafka_listener_security_protocol_map
    - kafka_inter_broker_listener_name
    - kafka_offsets_topic_replication_factor
    command: /bin/sh -c "export KAFKA_BROKER_ID=$(cat 
      /run/secrets/kafka_broker_id) && export KAFKA_ZOOKEEPER_CONNECT=$(cat 
      /run/secrets/kafka_zookeeper_connect) && export 
      KAFKA_ADVERTISED_LISTENERS=$(cat /run/secrets/kafka_advertised_listeners) 
      && export KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=$(cat 
      /run/secrets/kafka_listener_security_protocol_map) && export 
      KAFKA_INTER_BROKER_LISTENER_NAME=$(cat 
      /run/secrets/kafka_inter_broker_listener_name) && export 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=$(cat 
      /run/secrets/kafka_offsets_topic_replication_factor) && exec 
      /etc/confluent/docker/run"
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ~/.docker/config.json:/config.json
    # Checks for updates every 12 minutes (720 seconds)
    command: --interval 720

  # -------------------------------------------------------------------
  # 8. BACKEND API
  # -------------------------------------------------------------------
  backend:
    image: ghcr.io/7-3-n-3-7/backend:${BACKEND_TAG:-latest}
    container_name: backend
    restart: always
    env_file:
    - .env
    networks:
    - public-net
    - backend-net
    - kafka-net
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.backend.rule=Host(`api.157.180.43.151.nip.io`)"
    - "traefik.http.routers.backend.entrypoints=websecure"
    - "traefik.http.routers.backend.tls.certresolver=myresolver"
    - "traefik.http.services.backend.loadbalancer.server.port=8081"
    - "traefik.docker.network=infrastructure_public-net"

  # -------------------------------------------------------------------
  # 9. FRONTEND UI
  # -------------------------------------------------------------------
    secrets:
    - spring_datasource_url
    - spring_datasource_username
    - spring_datasource_password
    - spring_data_mongodb_host
    - spring_data_redis_host
    - spring_kafka_bootstrap_servers
    - spring_security_oauth2_resourceserver_jwt_issuer_uri
  frontend:
    image: ghcr.io/7-3-n-3-7/frontend:${FRONTEND_TAG:-latest}
    container_name: frontend
    restart: always
    networks:
    - public-net
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.frontend.rule=Host(`platform.157.180.43.151.nip.io`)"
    - "traefik.http.routers.frontend.entrypoints=websecure"
    - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    - "traefik.http.routers.frontend.middlewares=oauth-auth"
    - "traefik.http.services.frontend.loadbalancer.server.port=80"
    - "traefik.docker.network=infrastructure_public-net"

  # -------------------------------------------------------------------
  # 10. OAUTH2-PROXY
  # -------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: always
    env_file:
    - .env
    networks:
    - public-net
    labels:
    - "traefik.enable=true"
      # Route for callback URLs
    - "traefik.http.routers.oauth2-proxy.rule=Host(`platform.157.180.43.151.nip.io`,
      `server.157.180.43.151.nip.io`) && PathPrefix(`/oauth2/`)"
    - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
    - "traefik.http.routers.oauth2-proxy.tls.certresolver=myresolver"
    - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"

      # ForwardAuth Middleware declaration
    - "traefik.http.middlewares.oauth-auth.forwardauth.address=http://oauth2-proxy:4180/"
    - "traefik.http.middlewares.oauth-auth.forwardauth.trustForwardHeader=true"
    - "traefik.http.middlewares.oauth-auth.forwardauth.authResponseHeaders=Authorization,X-Forwarded-User,X-Forwarded-Access-Token"
    - "traefik.docker.network=infrastructure_public-net"
    secrets:
    - oauth2_proxy_provider
    - oauth2_proxy_client_id
    - oauth2_proxy_client_secret
    - oauth2_proxy_oidc_issuer_url
    - oauth2_proxy_cookie_secret
    - oauth2_proxy_cookie_domains
    - oauth2_proxy_cookie_secure
    - oauth2_proxy_email_domains
    - oauth2_proxy_pass_access_token
    - oauth2_proxy_pass_authorization_header
    - oauth2_proxy_http_address
    - oauth2_proxy_upstreams
    command: /bin/sh -c "export OAUTH2_PROXY_PROVIDER=$(cat 
      /run/secrets/oauth2_proxy_provider) && export OAUTH2_PROXY_CLIENT_ID=$(cat
      /run/secrets/oauth2_proxy_client_id) && export 
      OAUTH2_PROXY_CLIENT_SECRET=$(cat /run/secrets/oauth2_proxy_client_secret) 
      && export OAUTH2_PROXY_OIDC_ISSUER_URL=$(cat 
      /run/secrets/oauth2_proxy_oidc_issuer_url) && export 
      OAUTH2_PROXY_COOKIE_SECRET=$(cat /run/secrets/oauth2_proxy_cookie_secret) 
      && export OAUTH2_PROXY_COOKIE_DOMAINS=$(cat 
      /run/secrets/oauth2_proxy_cookie_domains) && export 
      OAUTH2_PROXY_COOKIE_SECURE=$(cat /run/secrets/oauth2_proxy_cookie_secure) 
      && export OAUTH2_PROXY_EMAIL_DOMAINS=$(cat 
      /run/secrets/oauth2_proxy_email_domains) && export 
      OAUTH2_PROXY_PASS_ACCESS_TOKEN=$(cat 
      /run/secrets/oauth2_proxy_pass_access_token) && export 
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=$(cat 
      /run/secrets/oauth2_proxy_pass_authorization_header) && export 
      OAUTH2_PROXY_HTTP_ADDRESS=$(cat /run/secrets/oauth2_proxy_http_address) &&
      export OAUTH2_PROXY_UPSTREAMS=$(cat /run/secrets/oauth2_proxy_upstreams) 
      && exec /bin/oauth2-proxy"
